apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  PORT: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recc-app
  template:
    metadata:
      labels:
        app: recc-app
    spec:
      containers:
        - name: app
          # Docker Desktop's k8s node can't see `docker build` images directly, so we pull from a local registry instead
          image: localhost:5000/recc-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: recc-app
spec:
  type: LoadBalancer
  selector:
    app: recc-app
  ports:
    - port: 3000
      targetPort: 3000
