# Copy this file to secrets.yaml and fill in real values.
# secrets.yaml is gitignored - never commit real secrets to k8s manifests.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DATABASE_URL: postgres://recc:change-me@postgres:5432/recc
  RAWG_API_KEY: your_rawg_key_here
  TMDB_API_KEY: your_tmdb_key_here
  GOOGLE_BOOKS_API_KEY: ""
