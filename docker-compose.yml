services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recc
      POSTGRES_PASSWORD: recc
      POSTGRES_DB: recc
    ports:
      # 5433, not 5432 - avoids clashing with a native Postgres install on the host
      - '5433:5432'
    volumes:
      - recc-db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      # containers reach each other by service name ("db") and its own port (5432), not the host-mapped 5433 above
      DATABASE_URL: postgres://recc:recc@db:5432/recc
      RAWG_API_KEY: ${RAWG_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
    ports:
      - '3000:3000'

volumes:
  recc-db-data:
