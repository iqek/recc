services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recc
      POSTGRES_PASSWORD: recc
      POSTGRES_DB: recc
    ports:
      # Host port 5433 (not 5432) - this machine already has a native
      # Postgres listening on 5432, and mapping onto it silently routes
      # connections to the wrong server.
      - '5433:5432'
    volumes:
      - recc-db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      # Inside the compose network, containers reach each other by service
      # name ("db"), not localhost - and by the container's own port (5432),
      # not the host-mapped one (5433) above.
      DATABASE_URL: postgres://recc:recc@db:5432/recc
      RAWG_API_KEY: ${RAWG_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
    ports:
      - '3000:3000'

volumes:
  recc-db-data:
